# One-command Postgres for local dev. Starts an empty Postgres on port 5432,
# auto-runs every file in db-schema-seeding/ on first boot (Postgres reads
# /docker-entrypoint-initdb.d/*.sql alphabetically — schema.sql runs before
# seed.sql by name order, which is what we want).
#
# Usage:
#   docker compose up -d
#   export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/smart_attendance
#   python app.py
#
# To reset to a clean seeded state: `docker compose down -v && docker compose up -d`

services:
  db:
    image: postgres:16
    container_name: smart_attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_attendance
    ports:
      - "5432:5432"
    volumes:
      - ./db-schema-seeding:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_attendance"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
